# Instalação pessoal em outra máquina; nenhum caminho ou segredo do ZimaOS.
services:
  learnflix:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    image: learnflix-telegram:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:7778:7777"
    environment:
      TZ: America/Sao_Paulo
      PORT: "7777"
      BIND: 0.0.0.0
      OPEN_BROWSER: "0"
      DATA_DIR: /runtime/data
      ALLOWED_ROOTS: /library
      TELEGRAM_API_ID_FILE: /runtime/private/api_id
      TELEGRAM_API_HASH_FILE: /runtime/private/api_hash
      TELEGRAM_SESSION: /runtime/private/session/account
      TELEGRAM_BRIDGE_URL: http://127.0.0.1:8099
      TELEGRAM_BRIDGE_TOKEN_FILE: /runtime/private/bridge.key
      ACCESS_PASSWORD_FILE: /runtime/private/access_password
    volumes:
      - learnflix-runtime:/runtime
      # Opcional: troque ./courses pelo caminho da sua pasta de cursos locais.
      - ./courses:/library:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  learnflix-runtime:
